			<text x="722" y="102" fill="#1c2330" font-size="12.5" font-family="sans-serif">A1 逆引き</text>
			<text x="722" y="122" fill="#1c2330" font-size="12.5" font-family="sans-serif">A2 型レシピ集</text>
