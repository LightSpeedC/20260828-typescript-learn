			<text x="586" y="66" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">10〜12 ／ 実務と演習</text>

			<text x="490" y="102" fill="#1c2330" font-size="12.5" font-family="sans-serif">10 モジュールと宣言ファイル</text>
