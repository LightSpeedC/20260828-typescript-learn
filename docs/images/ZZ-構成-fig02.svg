			<path d="M228,50 L242,50" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>
			<path d="M460,50 L474,50" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>
			<path d="M692,50 L706,50" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>

			<rect x="16" y="236" width="928" height="60" rx="8" fill="#f2f5fb" stroke="#d9dfe8"/>
			<text x="36" y="262" fill="#1c2330" font-size="13" font-family="sans-serif" font-weight="600">到達目標</text>
			<text x="36" y="283" fill="#4a5568" font-size="12.5" font-family="sans-serif">型の付いた .ts を自分で書き、tsc の吐くエラーを自力で読み解いて直せる状態にする</text>
		</svg>
