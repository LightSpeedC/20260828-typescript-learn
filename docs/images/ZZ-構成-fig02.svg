			<text x="122" y="66" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">01〜04 ／ 書いて動かす</text>

			<text x="26" y="102" fill="#1c2330" font-size="12.5" font-family="sans-serif">01 背景</text>
