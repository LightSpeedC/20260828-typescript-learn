			<text x="26" y="142" fill="#1c2330" font-size="12.5" font-family="sans-serif">03 tsconfig</text>
			<text x="26" y="162" fill="#1c2330" font-size="12.5" font-family="sans-serif">04 型の基本</text>

			<rect x="248" y="24" width="212" height="52" rx="8" fill="url(#i2)"/>
			<text x="354" y="47" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="600">第2部 型システム編</text>
			<text x="354" y="66" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">05〜09 ／ 資料の山場</text>

			<text x="258" y="102" fill="#1c2330" font-size="12.5" font-family="sans-serif">05 構造的型付け</text>
