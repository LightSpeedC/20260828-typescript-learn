<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 290" width="900" height="290" role="img" aria-label="検査する経路と実行する経路">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(280,78%,25%)"/>
					<stop offset="1" stop-color="hsl(280,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(140,78%,25%)"/>
					<stop offset="1" stop-color="hsl(140,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(40,78%,25%)"/>
					<stop offset="1" stop-color="hsl(40,58%,55%)"/>
				</linearGradient>
				<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
					<path d="M0,0 L10,5 L0,10 z" fill="#6b7686"/>
				</marker>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

			<rect width="100%" height="100%" fill="#ffffff"/>

			<rect x="16" y="112" width="130" height="60" rx="8" fill="url(#i3)"/>
			<text x="81" y="138" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="600">main.ts</text>
			<text x="81" y="158" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">型注釈あり</text>

			
			<rect x="238" y="26" width="120" height="56" rx="8" fill="url(#i1)"/>
			<text x="298" y="50" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="600">tsc</text>
			<text x="298" y="70" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">検査 ＋ 出力</text>

			<rect x="416" y="12" width="150" height="34" rx="6" fill="#fff" stroke="#a51f22" stroke-width="2"/>
			<text x="491" y="34" text-anchor="middle" fill="#a51f22" font-size="12.5" font-family="sans-serif" font-weight="600">型エラーの報告</text>

			<rect x="416" y="62" width="150" height="34" rx="6" fill="#fff" stroke="#8aa0c0" stroke-width="2"/>
			<text x="491" y="84" text-anchor="middle" fill="#1c2330" font-size="12.5" font-family="sans-serif">main.js</text>

			<rect x="628" y="26" width="120" height="56" rx="8" fill="url(#i2)"/>
			<text x="688" y="58" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="600">node</text>

			<text x="820" y="52" text-anchor="middle" fill="#1c2330" font-size="12.5" font-family="sans-serif">実行結果</text>

			<path d="M146,132 L230,70" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M358,44 L408,32" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M358,64 L408,76" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M566,79 L620,60" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M748,54 L780,54" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>

			
			<rect x="238" y="198" width="200" height="56" rx="8" fill="url(#i2)"/>
			<text x="338" y="222" text-anchor="middle" fill="#fff" font-size="14" font-family="sans-serif" font-weight="600">tsx ／ node ／ bun</text>
			<text x="338" y="242" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">型注釈を取り除いて実行</text>

			<text x="560" y="230" text-anchor="middle" fill="#1c2330" font-size="12.5" font-family="sans-serif">実行結果</text>

			<path d="M146,152 L230,215" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M438,226 L512,226" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>

			<text x="338" y="278" text-anchor="middle" fill="#a51f22" font-size="12.5" font-family="sans-serif" font-weight="600">こちらの経路では型エラーがあっても止まらない</text>

			<text x="180" y="105" fill="#4a5568" font-size="12" font-family="sans-serif">検査してから</text>
			<text x="180" y="186" fill="#4a5568" font-size="12" font-family="sans-serif">そのまま</text>
		</svg>
