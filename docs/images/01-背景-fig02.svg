<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="型を付ける3つの選択肢の比較">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(280,78%,25%)"/>
					<stop offset="1" stop-color="hsl(280,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(140,78%,25%)"/>
					<stop offset="1" stop-color="hsl(140,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(0,78%,25%)"/>
					<stop offset="1" stop-color="hsl(0,58%,55%)"/>
				</linearGradient>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

			<rect width="100%" height="100%" fill="#ffffff"/>

			<rect x="20" y="30" width="270" height="60" rx="8" fill="url(#i1)"/>
			<text x="155" y="56" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">TypeScript</text>
			<text x="155" y="77" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">.ts に型を書く</text>

			<text x="30" y="118" fill="#1c2330" font-size="12.5" font-family="sans-serif">検査: 強い</text>
			<text x="30" y="140" fill="#1c2330" font-size="12.5" font-family="sans-serif">ビルド: 必要</text>
			<text x="30" y="162" fill="#1c2330" font-size="12.5" font-family="sans-serif">エディタ支援: 最も厚い</text>
			<text x="30" y="184" fill="#1c2330" font-size="12.5" font-family="sans-serif">情報量: 最も多い</text>

			<rect x="315" y="30" width="270" height="60" rx="8" fill="url(#i2)"/>
			<text x="450" y="56" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">JSDoc</text>
			<text x="450" y="77" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">.js のコメントに型を書く</text>

			<text x="325" y="118" fill="#1c2330" font-size="12.5" font-family="sans-serif">検査: 強い（tsc で検査できる）</text>
			<text x="325" y="140" fill="#1c2330" font-size="12.5" font-family="sans-serif">ビルド: 不要</text>
			<text x="325" y="162" fill="#1c2330" font-size="12.5" font-family="sans-serif">エディタ支援: 厚い</text>
			<text x="325" y="184" fill="#1c2330" font-size="12.5" font-family="sans-serif">記述: 冗長になりやすい</text>

			<rect x="610" y="30" width="270" height="60" rx="8" fill="url(#i3)"/>
			<text x="745" y="56" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">型を付けない</text>
			<text x="745" y="77" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">素の JavaScript</text>

			<text x="620" y="118" fill="#1c2330" font-size="12.5" font-family="sans-serif">検査: なし</text>
			<text x="620" y="140" fill="#1c2330" font-size="12.5" font-family="sans-serif">ビルド: 不要</text>
			<text x="620" y="162" fill="#1c2330" font-size="12.5" font-family="sans-serif">エディタ支援: 推測に頼る</text>
			<text x="620" y="184" fill="#1c2330" font-size="12.5" font-family="sans-serif">小規模なら十分なこともある</text>

			<rect x="20" y="212" width="860" height="52" rx="8" fill="#f2f5fb" stroke="#d9dfe8"/>
			<text x="40" y="234" fill="#1c2330" font-size="12.5" font-family="sans-serif" font-weight="600">共通点</text>
			<text x="40" y="254" fill="#4a5568" font-size="12.5" font-family="sans-serif">どれも実行するのは JavaScript。型情報は実行時に残らない</text>
		</svg>
