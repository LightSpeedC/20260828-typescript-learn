			<text x="445" y="189" text-anchor="middle" fill="#4a5568" font-size="12" font-family="sans-serif">「Java・C# から来た人へ」</text>

			<rect x="650" y="110" width="230" height="86" rx="8" fill="url(#i4)"/>
			<text x="765" y="142" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">TypeScript 学習資料</text>
