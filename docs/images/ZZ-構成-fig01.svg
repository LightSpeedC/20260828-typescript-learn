			<text x="765" y="183" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">本編12章 ＋ 付録4本</text>

			<path d="M230,63 L640,130" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>
			<path d="M230,149 L322,163" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>
			<path d="M230,235 L322,190" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>
			<path d="M560,173 L640,160" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i5)"/>

			<text x="420" y="88" text-anchor="middle" fill="#4a5568" font-size="12" font-family="sans-serif">そのまま本文へ</text>
