			<text x="125" y="80" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Node + JavaScript 経験者</text>

			<rect x="20" y="120" width="210" height="58" rx="8" fill="url(#i2)"/>
			<text x="125" y="146" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">読者B</text>
			<text x="125" y="166" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">Java 経験者</text>

			<rect x="20" y="206" width="210" height="58" rx="8" fill="url(#i3)"/>
			<text x="125" y="232" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">読者C</text>
			<text x="125" y="252" text-anchor="middle" fill="#fff" font-size="13" font-family="sans-serif">C# 経験者</text>

			<rect x="330" y="140" width="230" height="66" rx="8" fill="none" stroke="#6b7686" stroke-width="2" stroke-dasharray="6 4"/>
