<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="tsc は型を検査し、型を消した JavaScript を出力する">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(186.7,78%,25%)"/>
					<stop offset="1" stop-color="hsl(186.7,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(280,78%,25%)"/>
					<stop offset="1" stop-color="hsl(280,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(40,78%,25%)"/>
					<stop offset="1" stop-color="hsl(40,58%,55%)"/>
				</linearGradient>
				<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
					<path d="M0,0 L10,5 L0,10 z" fill="#6b7686"/>
				</marker>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

			<rect width="100%" height="100%" fill="#ffffff"/>

			<rect x="20" y="70" width="180" height="70" rx="8" fill="url(#i2)"/>
			<text x="110" y="100" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">greet.ts</text>
			<text x="110" y="122" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">型注釈あり</text>

			<rect x="300" y="52" width="220" height="106" rx="8" fill="url(#i1)"/>
			<text x="410" y="82" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">tsc</text>
			<text x="410" y="106" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">① 型を検査する</text>
			<text x="410" y="128" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">② 型を取り除く</text>

			<rect x="620" y="70" width="180" height="70" rx="8" fill="url(#i3)"/>
			<text x="710" y="100" text-anchor="middle" fill="#fff" font-size="15" font-family="sans-serif" font-weight="600">greet.js</text>
			<text x="710" y="122" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif">型注釈なし</text>

			<path d="M200,105 L292,105" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M520,105 L612,105" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>

			<text x="410" y="188" text-anchor="middle" fill="#a51f22" font-size="13" font-family="sans-serif" font-weight="600">型はここで消える</text>
			<text x="410" y="210" text-anchor="middle" fill="#4a5568" font-size="12.5" font-family="sans-serif">実行時に型情報は 1 バイトも残らない</text>
			<path d="M410,160 L410,172" stroke="#a51f22" stroke-width="2" fill="none" marker-end="url(#i4)"/>

			<text x="710" y="188" text-anchor="middle" fill="#4a5568" font-size="12.5" font-family="sans-serif">Node・ブラウザが実行するのはこちら</text>
		</svg>
