<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" width="900" height="250" role="img" aria-label="外部データが型の付いた値になるまで">
			<defs>
				<linearGradient id="i1" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(0,78%,25%)"/>
					<stop offset="1" stop-color="hsl(0,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i2" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(40,78%,25%)"/>
					<stop offset="1" stop-color="hsl(40,58%,55%)"/>
				</linearGradient>
				<linearGradient id="i3" x1="0" y1="1" x2="0" y2="0">
					<stop offset="0" stop-color="hsl(140,78%,25%)"/>
					<stop offset="1" stop-color="hsl(140,58%,55%)"/>
				</linearGradient>
				<marker id="i4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
					<path d="M0,0 L10,5 L0,10 z" fill="#6b7686"/>
				</marker>
			</defs>
	<rect width="100%" height="100%" fill="#ffffff"/>

			<rect width="100%" height="100%" fill="#ffffff"/>

			<rect x="16" y="60" width="150" height="60" rx="8" fill="url(#i1)"/>
			<text x="91" y="84" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif" font-weight="600">ファイル</text>
			<text x="91" y="103" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">中身は不明</text>

			<rect x="206" y="60" width="150" height="60" rx="8" fill="url(#i2)"/>
			<text x="281" y="84" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif" font-weight="600">文字列</text>
			<text x="281" y="103" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">readFileSync</text>

			<rect x="396" y="60" width="150" height="60" rx="8" fill="url(#i2)"/>
			<text x="471" y="84" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif" font-weight="600">unknown</text>
			<text x="471" y="103" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">JSON.parse</text>

			<rect x="586" y="60" width="150" height="60" rx="8" fill="url(#i2)"/>
			<text x="661" y="84" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif" font-weight="600">unknown[]</text>
			<text x="661" y="103" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">Array.isArray</text>

			<rect x="746" y="60" width="140" height="60" rx="8" fill="url(#i3)"/>
			<text x="816" y="84" text-anchor="middle" fill="#fff" font-size="12.5" font-family="sans-serif" font-weight="600">Sale[]</text>
			<text x="816" y="103" text-anchor="middle" fill="#fff" font-size="12" font-family="sans-serif">isSale で1件ずつ</text>

			<path d="M166,90 L198,90" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M356,90 L388,90" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M546,90 L578,90" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>
			<path d="M736,90 L740,90" stroke="#6b7686" stroke-width="2" fill="none" marker-end="url(#i4)"/>

			<text x="281" y="146" text-anchor="middle" fill="#a51f22" font-size="12" font-family="sans-serif">読めない</text>
			<text x="471" y="146" text-anchor="middle" fill="#a51f22" font-size="12" font-family="sans-serif">JSON でない</text>
			<text x="661" y="146" text-anchor="middle" fill="#a51f22" font-size="12" font-family="sans-serif">配列でない</text>
			<text x="816" y="146" text-anchor="middle" fill="#a51f22" font-size="12" font-family="sans-serif">形が違う</text>

			<path d="M281,124 L281,140" stroke="#a51f22" stroke-width="1.5" fill="none"/>
