			<path d="M661,124 L661,140" stroke="#a51f22" stroke-width="1.5" fill="none"/>
			<path d="M816,124 L816,140" stroke="#a51f22" stroke-width="1.5" fill="none"/>

			<rect x="206" y="164" width="680" height="34" rx="6" fill="#fdf0f0" stroke="#e0a0a0"/>
			<text x="546" y="186" text-anchor="middle" fill="#a51f22" font-size="12.5" font-family="sans-serif" font-weight="600">失敗の種類ごとに別のメッセージで Result を返す</text>

			<text x="450" y="228" text-anchor="middle" fill="#1c2330" font-size="12.5" font-family="sans-serif" font-weight="600">4段の関門をすべて通ったものだけが Sale[] になる</text>
		</svg>
